name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: phylter-release
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install build dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: conda install -y cxx-compiler cmake ninja libblas liblapack

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: conda install -y cmake "libblas=*=*netlib" "liblapack=*=*netlib"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX;$CONDA_PREFIX/Library" \
            -DPHYLTER2_OPENMP=OFF -DPHYLTER2_BUNDLE_RUNTIME=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          conda_prefix_cmake="$(cygpath -m "$CONDA_PREFIX")"
          cmake -S . -B build-release -A x64 \
            -DCMAKE_PREFIX_PATH="$conda_prefix_cmake;$conda_prefix_cmake/Library" \
            -DPHYLTER2_BLAS_LIBRARY="$conda_prefix_cmake/Library/lib/blas.lib" \
            -DPHYLTER2_LAPACK_LIBRARY="$conda_prefix_cmake/Library/lib/lapack.lib" \
            -DPHYLTER2_OPENMP=OFF -DPHYLTER2_BUNDLE_RUNTIME=ON

      - name: Build and test
        run: |
          cmake --build build-release --config Release --parallel 2
          ctest --test-dir build-release -C Release --output-on-failure

      - name: Install runtime bundle
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev"
          fi
          case "$RUNNER_ARCH" in
            X64) arch="x86_64" ;;
            ARM64) arch="arm64" ;;
            *) arch="${RUNNER_ARCH,,}" ;;
          esac
          platform="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          bundle="phylter-${version}-${platform}-${arch}"
          mkdir -p package dist
          cmake --install build-release --config Release \
            --prefix "$PWD/package/$bundle" --component Runtime
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Test installed bundle (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          executable="$PWD/package/$BUNDLE/bin/phylter"
          tree="$PWD/package/$BUNDLE/share/phylter/examples/carnivora.nwk"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$executable" --version
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$executable" \
            --trees "$tree" --out "$RUNNER_TEMP/phylter-smoke/carnivora"

      - name: Test installed bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "package/$env:BUNDLE/bin/phylter.exe"
          $tree = Join-Path $PWD "package/$env:BUNDLE/share/phylter/examples/carnivora.nwk"
          $output = Join-Path $env:RUNNER_TEMP "phylter-smoke/carnivora"

          # Keep Windows itself available, but deliberately hide Conda and the
          # build environment. DLLs needed here must be present in the bundle.
          Get-ChildItem (Split-Path $executable) | Select-Object Name, Length
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          & $executable --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executable --trees $tree --out $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create archive and checksum
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="$BUNDLE.zip"
            (cd package && cmake -E tar cf "../dist/$archive" --format=zip "$BUNDLE")
          else
            archive="$BUNDLE.tar.gz"
            (cd package && cmake -E tar czf "../dist/$archive" "$BUNDLE")
          fi
          (cd dist && cmake -E sha256sum "$archive" > "$archive.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: phylter-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phylter-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "Phylter $version"
