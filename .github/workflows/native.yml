# Native C++ CLI build and test workflow.
name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: phylter-build
          channels: conda-forge
          conda-remove-defaults: true
      - run: conda install -y cxx-compiler cmake ninja libblas liblapack
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX;$CONDA_PREFIX/Library" \
            -DPHYLTER2_OPENMP=OFF
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          conda_prefix_cmake="$(cygpath -m "$CONDA_PREFIX")"
          test -f "$conda_prefix_cmake/Library/lib/blas.lib"
          test -f "$conda_prefix_cmake/Library/lib/lapack.lib"
          cmake -S . -B build -A x64 \
            -DCMAKE_PREFIX_PATH="$conda_prefix_cmake;$conda_prefix_cmake/Library" \
            -DPHYLTER2_BLAS_LIBRARY="$conda_prefix_cmake/Library/lib/blas.lib" \
            -DPHYLTER2_LAPACK_LIBRARY="$conda_prefix_cmake/Library/lib/lapack.lib" \
            -DPHYLTER2_OPENMP=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
